<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>EdgeStack · 手机演示</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #e7ebe4; color: #24382e; font-family: system-ui, sans-serif; }
    iframe { display: block; width: min(100%, 390px); height: min(100%, 844px); border: 0; background: #fafbf8; box-shadow: 0 0 0 1px #c8cfc5; }
  </style>
</head>
<body>
  <script>
    const userPage = '../user/edgestack-user.html';
    if (matchMedia('(max-width: 640px)').matches) {
      location.replace(userPage);
    } else {
      const preview = document.createElement('iframe');
      preview.title = '手机端用户登录与工作台';
      preview.src = userPage;
      document.body.append(preview);
    }
  </script>
  <noscript>请启用 JavaScript 后<a href="../user/edgestack-user.html">打开用户端演示</a>。</noscript>
</body>
</html>
